[package]
name = "yoink"
version.workspace = true
edition.workspace = true

[dependencies]
yoink-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
crossterm = "0.28"
