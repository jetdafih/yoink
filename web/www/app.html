<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoink · app</title>
<link rel="icon" href="logo.svg">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav>
    <a class="brand" href="./"><img src="logo.svg" alt="">yoink</a>
    <a class="link" href="https://github.com/jetdafih/yoink" aria-label="yoink on GitHub" title="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </nav>

  <div class="tabs">
    <y-tab id="tab-send" class="on">Send</y-tab>
    <y-tab id="tab-get">Receive</y-tab>
  </div>
  <p id="boot" class="hint">loading…</p>

  <section id="send" hidden>
    <div id="pick">
      <div class="drop" id="drop"><b>Drop files or folders</b><br>or tap to choose</div>
      <input id="fi" type="file" multiple hidden>
      <input id="di" type="file" webkitdirectory hidden>
      <ul class="files" id="list"></ul>
      <p class="hint" id="sum"></p>
      <div class="row">
        <y-button class="btn" id="go" disabled>Create ticket</y-button>
        <y-button class="btn ghost" id="dirbtn">Add folder</y-button>
      </div>
      <p class="err" id="serr"></p>
    </div>
    <div id="shared" hidden>
      <div class="box">
        <p class="ticket" id="ticket"></p>
        <div class="row">
          <y-button class="btn ghost" id="cp-t">Copy ticket</y-button>
          <y-button class="btn ghost" id="cp-l">Copy link</y-button>
        </div>
        <p class="hint mono" id="cli"></p>
        <canvas id="qr"></canvas>
      </div>
      <p id="sstatus" class="hint">Waiting for the receiver. Keep this tab open.</p>
      <y-button class="btn ghost" id="stop">Stop sharing</y-button>
    </div>
  </section>

  <section id="get" hidden>
    <div id="ask">
      <div class="pair">
        <input id="tin" type="text" placeholder="Paste a ticket or link" autocomplete="off" spellcheck="false">
        <y-button class="btn" id="conn">Connect</y-button>
      </div>
      <div class="drop" id="qrdrop"><b>Scan a QR code</b><br>paste, drop or choose an image</div>
      <input id="qi" type="file" accept="image/*" hidden>
      <p class="err" id="rerr"></p>
    </div>
    <div id="found" hidden>
      <div class="box split">
        <div>
          <b id="fname"></b>
          <div class="hint" id="fsize"></div>
        </div>
        <y-button class="btn" id="dl">Download</y-button>
      </div>
    </div>
    <div class="trail" id="trail"></div>
    <ul class="files" id="out"></ul>
    <y-button class="btn ghost" id="all" hidden>Save all</y-button>
  </section>
</main>
<script src="jsQR.js"></script>
<script type="module" src="widgets.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
