[package]
name = "yoink-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = "1.4"
iroh-blobs = { version = "0.105", default-features = false }
bao-tree = { version = "0.17", default-features = false }
bytes = "1"
postcard = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
yoink-core = { path = "../core", default-features = false }
n0-future = "0.3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
qrcode = { version = "0.14", default-features = false }
